---
name: 11. Cleanup Smart Agent Directory

"on":
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of hosts per batch
        required: false
        default: 256
        type: number

permissions:
  contents: read

concurrency:
  group: smartagent-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: self-hosted
    outputs:
      batches: ${{ steps.create-batches.outputs.batches }}
      total_hosts: ${{ steps.create-batches.outputs.total_hosts }}
      total_batches: ${{ steps.create-batches.outputs.total_batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: create-batches
        name: Create host batches
        env:
          DEPLOYMENT_HOSTS: ${{ vars.DEPLOYMENT_HOSTS }}
          BATCH_SIZE: ${{ inputs.batch_size || 256 }}
        run: bash .github/scripts/create-batches.sh

  cleanup-batch:
    needs: prepare
    runs-on: self-hosted
    if: >-
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.total_batches != '0'
    strategy:
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clear Smart Agent directory on batch hosts
        env:
          BATCH_HOSTS: ${{ toJson(matrix.batch) }}
          OPERATION_LABEL: Cleanup Smart Agent Directory
          REMOTE_COMMAND: |
            if [[ -d /opt/appdynamics/appdsmartagent ]]; then
              sudo find /opt/appdynamics/appdsmartagent \
                -mindepth 1 \
                -maxdepth 1 \
                -exec rm -rf -- {} +
              sudo chown -R "$TARGET_OWNER:$TARGET_GROUP" \
                /opt/appdynamics/appdsmartagent
              echo "Cleared /opt/appdynamics/appdsmartagent"
            else
              echo "/opt/appdynamics/appdsmartagent does not exist"
            fi
          SMARTAGENT_GROUP: ${{ vars.SMARTAGENT_GROUP }}
          SMARTAGENT_USER: ${{ vars.SMARTAGENT_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
        run: bash .github/scripts/run-remote-command-batch.sh

  check_client_inventory_api:
    needs:
      - prepare
      - cleanup-batch
    runs-on: self-hosted
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Client Inventory API
        env:
          API_CHECK_WARN_ONLY: "true"
          CLIENT_INVENTORY_API_BASE_URL: >-
            ${{ vars.CLIENT_INVENTORY_API_BASE_URL }}
          CLIENT_INVENTORY_API_TOKEN: >-
            ${{ secrets.CLIENT_INVENTORY_API_TOKEN }}
          CLIENT_INVENTORY_SAMPLE_SIZE: >-
            ${{ vars.CLIENT_INVENTORY_SAMPLE_SIZE || 1 }}
        run: bash .github/scripts/check-client-inventory-api.sh

  summary:
    needs:
      - prepare
      - cleanup-batch
      - check_client_inventory_api
    runs-on: self-hosted
    if: always()
    steps:
      - name: Cleanup summary
        run: |
          echo "Smart Agent Directory Cleanup Summary"
          echo "====================================="
          echo "Total hosts: ${{ needs.prepare.outputs.total_hosts }}"
          echo "Total batches: ${{ needs.prepare.outputs.total_batches }}"
          echo "Status: ${{ needs.cleanup-batch.result }}"
          echo "API: ${{ needs.check_client_inventory_api.result }}"
